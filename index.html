<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>M3 Noir Sequence</title>
  <meta
    name="description"
    content="A scroll-controlled cinematic journey from a dark studio exterior into the cockpit of a matte black M3."
  />
  <style>
    :root,
    .sw-root {
      --sw-bg: #030304;
      --sw-ink: #f6f3f1;
      --sw-ink-soft: #b8adac;
      --sw-accent: #ed1b3d;
      --sw-font-display: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --sw-font-body: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    html {
      background: #030304;
      color: #f6f3f1;
    }

    body {
      min-width: 320px;
    }

    .sw-root .sw-sky {
      background:
        radial-gradient(circle at 74% 32%, rgba(237, 27, 61, 0.16), transparent 34%),
        radial-gradient(circle at 28% 70%, rgba(125, 6, 24, 0.22), transparent 30%),
        #030304;
    }

    .sw-root .sw-sky__grad,
    .sw-root .sw-sky__glow,
    .sw-root .sw-particles {
      display: none;
    }

    .sw-root .sw-topbar {
      padding-top: clamp(16px, 2.6vw, 30px);
    }

    .sw-root .sw-brand {
      color: #f6f3f1;
      letter-spacing: 0.03em;
    }

    .sw-root .sw-brand__mark {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(255, 255, 255, 0.86) 0 12%, transparent 13%),
        conic-gradient(from 45deg, #ed1b3d, #26050b, #ed1b3d, #040405, #ed1b3d);
      box-shadow: 0 0 22px rgba(237, 27, 61, 0.58);
    }

    .sw-root .sw-nav {
      background: rgba(8, 8, 10, 0.62);
      border-color: rgba(255, 255, 255, 0.12);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.28);
    }

    .sw-root .sw-nav__item {
      color: rgba(246, 243, 241, 0.64);
    }

    .sw-root .sw-nav__item:hover,
    .sw-root .sw-nav__item.is-active {
      color: #fff;
    }

    .sw-root .sw-nav__item.is-active {
      background: rgba(237, 27, 61, 0.82);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    .sw-root .sw-topcta,
    .sw-root .sw-btn--primary {
      background: #ed1b3d;
      color: #fff;
      box-shadow: 0 16px 34px rgba(237, 27, 61, 0.25);
    }

    .sw-root .sw-copylayer::before {
      width: min(60vw, 820px);
      background:
        linear-gradient(90deg, rgba(3, 3, 4, 0.94) 0%, rgba(3, 3, 4, 0.74) 42%, rgba(3, 3, 4, 0.22) 72%, transparent 100%);
    }

    .sw-root .sw-copy {
      width: min(40vw, 430px);
    }

    .sw-root .sw-copy__num {
      color: rgba(246, 243, 241, 0.5);
    }

    .sw-root .sw-copy__eyebrow {
      color: #ff4c65;
    }

    .sw-root .sw-copy__title {
      color: #fff;
      letter-spacing: 0;
      text-shadow: 0 14px 38px rgba(0, 0, 0, 0.72);
    }

    .sw-root .sw-copy__body {
      color: rgba(246, 243, 241, 0.74);
      text-shadow: 0 10px 30px rgba(0, 0, 0, 0.82);
    }

    .sw-root .sw-copy__tags li {
      color: #fff;
      background: rgba(237, 27, 61, 0.16);
      border-color: rgba(237, 27, 61, 0.36);
      backdrop-filter: blur(10px);
    }

    .sw-root .sw-btn--ghost {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.26);
      background: rgba(255, 255, 255, 0.04);
    }

    .sw-root .sw-route::before {
      background: rgba(237, 27, 61, 0.9);
    }

    .sw-root .sw-route__label {
      color: #fff;
      background: rgba(8, 8, 10, 0.72);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .sw-root .sw-hint {
      color: rgba(246, 243, 241, 0.72);
    }

    .sw-root .sw-hint i {
      border-color: rgba(246, 243, 241, 0.34);
    }

    .sw-root .sw-scene__video,
    .sw-root .sw-scene__still {
      object-position: center center;
    }

    @media (max-width: 860px) {
      .sw-root .sw-copylayer::before {
        width: 100%;
        height: 68%;
        background:
          linear-gradient(0deg, rgba(3, 3, 4, 0.96) 0%, rgba(3, 3, 4, 0.74) 46%, transparent 100%);
      }

      .sw-root .sw-copy {
        width: auto;
      }
    }
  </style>
</head>
<body>
  <div id="top"></div>
  <main id="world" aria-label="M3 Noir Sequence scroll experience"></main>

  <script src="scrub-engine.js"></script>
  <script>
    mountScrollWorld(document.getElementById('world'), {
      brand: { name: 'M3 Noir Sequence', href: '#top' },
      cta: { label: 'Scroll the drive', href: '#top' },
      hint: 'scroll to enter',
      nav: true,
      atmosphere: false,
      crossfade: 0.1,
      diveScroll: 1.28,
      connScroll: 0.55,
      sections: [
        {
          id: 'studio',
          label: 'Studio',
          still: 'assets/poster/01-studio.jpg',
          clip: 'assets/vid/01-studio.mp4',
          accent: '#ed1b3d',
          scroll: 1.45,
          linger: 0.18,
          eyebrow: 'Exterior',
          title: 'Black paint, red pulse.',
          body: 'The journey starts low on the wet studio floor, closing in on the matte body and red light signature.',
          tags: ['Matte black', 'Wet floor', 'Red signature']
        },
        {
          id: 'door',
          label: 'Access',
          still: 'assets/poster/02-door.jpg',
          clip: 'assets/vid/02-door.mp4',
          accent: '#ff304f',
          scroll: 1.35,
          linger: 0.2,
          eyebrow: 'Transition',
          title: 'The door opens.',
          body: 'The camera shifts right as the driver-side door reveals the next space without breaking the shot.',
          tags: ['One movement', 'Driver side', 'No hard cut']
        },
        {
          id: 'cockpit',
          label: 'Cockpit',
          still: 'assets/poster/03-cockpit.jpg',
          clip: 'assets/vid/03-cockpit.mp4',
          accent: '#fb2445',
          scroll: 1.38,
          linger: 0.28,
          eyebrow: 'Interior',
          title: 'Inside the cabin.',
          body: 'Leather, carbon texture and red ambient lines come forward as the camera crosses the open doorway.',
          tags: ['Open cabin', 'Carbon detail', 'Dark studio']
        },
        {
          id: 'ignition',
          label: 'Ignition',
          still: 'assets/poster/04-ignition.jpg',
          clip: 'assets/vid/04-ignition.mp4',
          accent: '#ff3d59',
          scroll: 1.75,
          linger: 0.42,
          eyebrow: 'Finale',
          title: 'The cockpit wakes.',
          body: 'The displays brighten and the red cabin light settles into the final hero moment.',
          tags: ['Dashboard glow', 'Ambient red', 'Ready state'],
          cta: {
            primary: { label: 'Replay the sequence', href: '#top' },
            secondary: { label: 'View on GitHub', href: 'https://github.com/Marcius55/bmw-m3-scroll-world' }
          }
        }
      ],
      connectors: []
    });
  </script>
</body>
</html>
