<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>M3 Noir Sequence</title>
  <meta
    name="description"
    content="A scroll-controlled cinematic journey from a dark studio exterior into the cockpit of a matte black M3."
  />
  <style>
    :root,
    .sw-root {
      --sw-bg: #030304;
      --sw-ink: #f6f3f1;
      --sw-ink-soft: #b8adac;
      --sw-accent: #ed1b3d;
      --sw-font-display: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --sw-font-body: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    html {
      background: #030304;
      color: #f6f3f1;
    }

    body {
      min-width: 320px;
    }

    .sw-root .sw-sky {
      background:
        radial-gradient(circle at 74% 32%, rgba(237, 27, 61, 0.16), transparent 34%),
        radial-gradient(circle at 28% 70%, rgba(125, 6, 24, 0.22), transparent 30%),
        #030304;
    }

    .sw-root .sw-sky__grad,
    .sw-root .sw-sky__glow,
    .sw-root .sw-particles {
      display: none;
    }

    .sw-root .sw-topbar {
      display: grid;
      grid-template-columns: minmax(72px, 1fr) auto minmax(148px, 1fr);
      align-items: center;
      gap: clamp(14px, 2vw, 26px);
      padding-top: clamp(14px, 2.2vw, 24px);
    }

    .sw-root .sw-brand {
      color: #f6f3f1;
      letter-spacing: 0.03em;
      justify-self: start;
    }

    .sw-root .sw-brand__mark {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      position: relative;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 50%, #ffffff 0 38%, #050507 39% 48%, #ffffff 49% 100%);
      border: 1px solid rgba(255, 255, 255, 0.94);
      filter: drop-shadow(0 0 14px rgba(255, 255, 255, 0.5)) drop-shadow(0 0 24px rgba(237, 27, 61, 0.22));
      isolation: isolate;
    }

    .sw-root .sw-brand__mark::before {
      content: "BMW";
      position: relative;
      z-index: 1;
      color: #050507;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.08em;
      transform: translateX(0.5px);
    }

    .sw-root .sw-brand__mark::after {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 0 22px rgba(255, 255, 255, 0.18), 0 0 32px rgba(237, 27, 61, 0.2);
      pointer-events: none;
    }

    .sw-root .sw-brand__name {
      display: none;
    }

    .sw-root .sw-nav {
      justify-self: center;
      display: flex;
      align-items: center;
      max-width: min(62vw, 760px);
      overflow: hidden;
      background: rgba(8, 8, 10, 0.48);
      border-color: rgba(255, 255, 255, 0.14);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
    }

    .sw-root .sw-nav__item {
      color: rgba(246, 243, 241, 0.68);
      max-width: 96px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 8px 12px;
      line-height: 1;
    }

    .sw-root .sw-nav__item:hover,
    .sw-root .sw-nav__item.is-active {
      color: #fff;
    }

    .sw-root .sw-nav__item.is-active {
      background: rgba(237, 27, 61, 0.82);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    .sw-root .sw-topcta,
    .sw-root .sw-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1;
      box-sizing: border-box;
    }

    .sw-root .sw-topcta,
    .sw-root .sw-btn--primary {
      background: #ed1b3d;
      color: #fff;
      box-shadow: 0 16px 34px rgba(237, 27, 61, 0.25);
    }

    .sw-root .sw-topcta {
      justify-self: end;
      height: 46px;
      min-width: 148px;
      padding: 0 24px 1px;
      align-self: center;
      letter-spacing: 0.01em;
      box-shadow: 0 18px 36px rgba(237, 27, 61, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.16);
    }

    .sw-root .sw-btn {
      min-height: 46px;
      padding: 0 24px 1px;
    }

    .sw-root .sw-copylayer::before {
      width: min(60vw, 820px);
      background:
        linear-gradient(90deg, rgba(3, 3, 4, 0.94) 0%, rgba(3, 3, 4, 0.74) 42%, rgba(3, 3, 4, 0.22) 72%, transparent 100%);
    }

    .sw-root .sw-copy {
      width: min(39vw, 430px);
    }

    .sw-root .sw-copy__num {
      color: rgba(246, 243, 241, 0.5);
    }

    .sw-root .sw-copy__eyebrow {
      color: #ff4c65;
    }

    .sw-root .sw-copy__title {
      color: #fff;
      letter-spacing: 0;
      text-shadow: 0 14px 38px rgba(0, 0, 0, 0.72);
    }

    .sw-root .sw-copy__body {
      color: rgba(246, 243, 241, 0.74);
      text-shadow: 0 10px 30px rgba(0, 0, 0, 0.82);
    }

    .sw-root .sw-copy__tags li {
      color: #fff;
      background: rgba(237, 27, 61, 0.16);
      border-color: rgba(237, 27, 61, 0.36);
      backdrop-filter: blur(10px);
    }

    .sw-root .sw-btn--ghost {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.26);
      background: rgba(255, 255, 255, 0.04);
    }

    .sw-root .sw-route::before {
      background: rgba(237, 27, 61, 0.9);
    }

    .sw-root .sw-route {
      width: 44px;
      align-items: center;
      right: clamp(12px, 2vw, 26px);
      padding-inline: 0;
    }

    .sw-root .sw-route__dot {
      width: 24px;
      height: 24px;
      padding: 0;
      place-items: center;
    }

    .sw-root .sw-route__dot i {
      width: 8px;
      height: 8px;
    }

    .sw-root .sw-route__label {
      color: #fff;
      background: rgba(8, 8, 10, 0.72);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .sw-root .sw-hint {
      color: rgba(246, 243, 241, 0.72);
      bottom: calc(22px + env(safe-area-inset-bottom));
    }

    .sw-root .sw-hint i {
      border-color: rgba(246, 243, 241, 0.34);
    }

    .sw-root .sw-scene__video,
    .sw-root .sw-scene__still {
      object-position: center center;
    }

    @media (max-width: 860px) {
      .sw-root .sw-topbar {
        grid-template-columns: auto 1fr;
        padding: 14px 18px 0;
      }

      .sw-root .sw-nav {
        display: none;
      }

      .sw-root .sw-brand__mark {
        width: 44px;
        height: 44px;
      }

      .sw-root .sw-topcta {
        min-width: 138px;
        height: 42px;
        padding: 0 18px 1px;
        font-size: 0.84rem;
      }

      .sw-root .sw-copylayer::before {
        width: 100%;
        height: 68%;
        background:
          linear-gradient(0deg, rgba(3, 3, 4, 0.96) 0%, rgba(3, 3, 4, 0.74) 46%, transparent 100%);
      }

      .sw-root .sw-copy {
        width: auto;
        bottom: calc(clamp(112px, 20dvh, 152px) + env(safe-area-inset-bottom));
      }

      .sw-root .sw-hint {
        bottom: calc(18px + env(safe-area-inset-bottom));
        transform: translateX(-50%) scale(0.9);
      }

      .sw-root .sw-route {
        right: 8px;
        width: 34px;
        gap: 14px;
      }
    }
  </style>
</head>
<body>
  <div id="top"></div>
  <main id="world" aria-label="M3 Noir Sequence scroll experience"></main>

  <script src="scrub-engine.js"></script>
  <script>
    const sections = [
      {
        id: 'studio',
        label: 'Studio',
        still: 'assets/poster/01-studio.jpg',
        clip: 'assets/vid/01-studio.mp4',
        accent: '#ed1b3d',
        scroll: 1.36,
        linger: 0.16,
        eyebrow: 'The M3',
        title: 'Intensity in its purest form.',
        body: 'A sculpted sports sedan, reduced to shadow, stance and the unmistakable red pulse of performance.',
        tags: ['Competition spirit', 'Matte presence', 'Track-bred stance']
      },
      {
        id: 'door',

        still: 'assets/poster/02-door.jpg',
        clip: 'assets/vid/02-door.mp4',
        accent: '#ff304f',
        scroll: 1.22,
        linger: 0.18,
        eyebrow: 'Design',

        tags: ['Driver access', 'Sculpted surfaces', 'Purposeful detail']
      },
      {
        id: 'cockpit',
        label: 'Entry',
        still: 'assets/poster/03-cockpit.jpg',
        clip: 'assets/vid/03-cockpit.mp4',
        accent: '#fb2445',
        scroll: 1.26,
        linger: 0.24,
        eyebrow: 'Cockpit',
        title: 'Built around the pulse.',
        body: 'A focused cabin surrounds you with deep black materials, precise controls and a low red glow.',
        tags: ['Driver-oriented', 'Carbon texture', 'Ambient red']
      },
      {
        id: 'ignition',
        label: 'Ignition',
        still: 'assets/poster/04-ignition.jpg',
        clip: 'assets/vid/04-ignition.mp4',
        accent: '#ff3d59',
        scroll: 1.38,
        linger: 0.34,
        eyebrow: 'Ignition',
        title: 'Ready before the first touch.',
        body: 'Displays come alive with a clean digital glow, setting the cabin into a precise performance state.',
        tags: ['Live display', 'Performance focus', 'Ready state']
      },
      {
        id: 'cluster',
        label: 'Cluster',
        still: 'assets/poster/05-cluster.jpg',
        clip: 'assets/vid/05-cluster.mp4',
        accent: '#ff435f',
        scroll: 1.18,
        linger: 0.28,
        eyebrow: 'Interface',
        title: 'Information, sharpened.',
        body: 'The driver display prioritizes what matters: speed, response and the next decision.',
        tags: ['Digital cluster', 'Clear readout', 'Fast focus']
      },
      {

      },
      {
        id: 'ambient',
        label: 'Ambient',
        still: 'assets/poster/07-ambient.jpg',
        clip: 'assets/vid/07-ambient.mp4',
        accent: '#ff5570',
        scroll: 1.22,
        linger: 0.32,
        eyebrow: 'Atmosphere',
        title: 'Performance, illuminated.',
        body: 'A continuous red light signature ties exterior aggression to interior calm.',
        tags: ['Ambient lighting', 'Door contour', 'Night drive mood']
      },
      {
        id: 'exit',
        label: 'Profile',
        still: 'assets/poster/08-exit.jpg',
        clip: 'assets/vid/08-exit.mp4',
        accent: '#ff4b63',
        scroll: 1.34,
        linger: 0.38,
        eyebrow: 'Final stance',
        title: 'Composure after the surge.',
        body: 'The door settles shut and the full silhouette returns to the studio: low, wide and unmistakably M.',
        tags: ['Side profile', 'Closed-door finish', 'Wet studio reflection'],
        cta: {
          primary: { label: 'Replay the sequence', href: '#top' },
          secondary: { label: 'View on GitHub', href: 'https://github.com/Marcius55/bmw-m3-scroll-world' }
        }
      }
    ];

    mountScrollWorld(document.getElementById('world'), {
      brand: { name: 'BMW', href: '#top' },
      cta: { label: 'Scroll the drive', href: '#top' },
      hint: 'scroll to enter',
      nav: true,
      atmosphere: false,
      crossfade: 0.09,
      diveScroll: 1.24,
      connScroll: 0.55,
      sections,
      connectors: []
    });

  </script>
</body>
</html>
